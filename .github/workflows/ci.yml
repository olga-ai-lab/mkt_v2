name: CI

on:
  # Antes: `push: { branches: [main] }`. Como `main` esta vazia e nao havia PR
  # aberto, a CI nunca rodou uma vez sequer — protecao que nao executa nao
  # protege. Agora roda em qualquer branch empurrada.
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olga_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/olga_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - run: npm install

      # Migrations antes de qualquer teste, não só do RLS: desde que
      # packages/runtime/test passou a ter casos que tocam Postgres de
      # verdade (prompt-templates.test.mjs, ports-postgres-briefs.test.mjs),
      # rodar "Model Gateway e Agent Runtime" contra um banco sem schema
      # falhava com "relation mkt.organizations does not exist" — a suíte
      # via TEST_DATABASE_URL definido e presumia que o schema já existia,
      # mas aqui só a etapa Migrations o cria. Rodar migrations primeiro é
      # a garantia que se aplica a qualquer teste futuro que precise do
      # banco, não só ao de hoje.
      - name: Migrations
        run: npm run db:migrate:local

      # Contratos primeiro entre os testes: se schema e tipo divergirem,
      # nada mais importa.
      - name: Contratos
        run: npm run test:contracts

      - name: Tipos gerados batem com os schemas
        run: |
          npm run contracts:generate
          git diff --exit-code packages/contracts/generated/ \
            || (echo "::error::generated/ esta fora de sincronia. Rode npm run contracts:generate e commite." && exit 1)

      - name: Policy engine
        run: npm run test:policy

      - name: Capability Gateway
        run: npm run test:gateway

      - name: Model Gateway e Agent Runtime
        run: npm run test:runtime

      - name: Workflow de publicacao e outbox
        run: npm run test:worker

      - name: Microcopy cobre todo reason code
        run: npm run test:web

      - name: Isolamento cross-tenant
        run: npm run test:rls

      - name: Tipos do app web
        run: npm run typecheck

      # O app web ja esteve num estado em que nao compilava — lib/auth.ts era
      # importada e nao existia. Teste passando nao pega isso; build pega.
      - name: App web compila
        run: npm run build:web

      - name: Parsers dos gates cobrem os reporters TAP e spec
        run: npm run test:gates

      # Evals de governanca dos agentes. Deterministicos: so o modelo e
      # roteirizado; policies, registries e gateways sao os reais.
      - name: Evals dos agentes
        run: npm run evals

      - name: Gate G0
        run: npm run gate:g0

      - name: Gate G1
        run: npm run gate:g1
